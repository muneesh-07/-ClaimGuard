[project]
name = "claimguard-scoring"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "leidenalg>=0.12.0",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-igraph>=1.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
