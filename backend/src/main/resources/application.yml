spring:
  application:
    name: claimguard-backend

  datasource:
    # Port 5434, not 5432 - see infra/docker-compose.yml for why.
    url: jdbc:postgresql://localhost:5434/claimguard
    username: claimguard
    password: claimguard_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration) owns every schema change now. 'validate' just
      # confirms the entities and the migrations still agree on startup -
      # if they don't, the app refuses to start instead of running on a
      # schema nobody reviewed.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

claimguard:
  entity-resolution:
    # Region used to interpret phone numbers with no country code, e.g.
    # "9876500011" -> +919876500011. Change per deployment locale.
    default-phone-region: IN

# NOTE: Kafka and Redis connection config are intentionally left out of
# this file for now. We'll add them once claim persistence + the
# workflow states are working end to end.
