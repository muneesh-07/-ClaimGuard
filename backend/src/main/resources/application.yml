spring:
  application:
    name: claimguard-backend

  datasource:
    # Port 5434, not 5432 - see infra/docker-compose.yml for why.
    url: jdbc:postgresql://localhost:5434/claimguard
    username: claimguard
    password: claimguard_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration) owns every schema change now. 'validate' just
      # confirms the entities and the migrations still agree on startup -
      # if they don't, the app refuses to start instead of running on a
      # schema nobody reviewed.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    # Plain string (de)serializers on both key and value - JSON is
    # handled by hand (ObjectMapper) at the edges instead of Spring
    # Kafka's JsonSerializer, which stamps Java-type headers a Python
    # consumer has no use for. Keeping both sides of the topic contract
    # to plain, portable JSON strings.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: claimguard-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  data:
    redis:
      host: localhost
      # Port 6380, not 6379 - see infra/docker-compose.yml for why.
      port: 6380

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

claimguard:
  entity-resolution:
    # Region used to interpret phone numbers with no country code, e.g.
    # "9876500011" -> +919876500011. Change per deployment locale.
    default-phone-region: IN
