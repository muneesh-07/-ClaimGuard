claimguard:
  outbox:
    publisher:
      # See OutboxPublisher's class Javadoc: without this, the scheduled
      # publisher keeps polling after each test's Testcontainers
      # Postgres is torn down, spamming connection-timeout errors and
      # delaying JVM shutdown. Outbox rows are still written and can
      # still be asserted on directly; only the background Kafka
      # publish loop is disabled.
      enabled: false
